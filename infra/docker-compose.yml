services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tax_tracker
      POSTGRES_USER: tax_tracker
      POSTGRES_PASSWORD: tax_tracker_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_tracker -d tax_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tax_tracker:tax_tracker_dev_only@db:5432/tax_tracker
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
